<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff8ec" />
  <title>Trip Track</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Track every trip. Light up your world." />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('triptrack:theme') || localStorage.getItem('wayfarer:theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="Trip Track home"><img class="brand-logo" src="/brand/logo-horizontal.svg" alt="Trip Track" width="150" height="40" /></a>
    <nav class="actions" aria-label="Actions">
      <button id="theme" class="icon-btn" type="button" aria-label="Switch theme"></button>
      <button id="log" class="solid" type="button"><span data-icon="plus"></span>Log a trip</button>
    </nav>
  </header>

  <main>
    <section id="stage" class="stage" aria-label="Your world">
      <div id="globe" role="application" aria-label="Interactive globe of the places you have been"></div>

      <button id="stage-search" class="search-pill" type="button"><span data-icon="search"></span>Search any city<kbd>/</kbd></button>

      <div class="zoom" role="group" aria-label="Zoom">
        <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in"><span data-icon="plus"></span></button>
        <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out"><span data-icon="minus"></span></button>
        <button id="reset" class="icon-btn" type="button" aria-label="Reset view"><span data-icon="reset"></span></button>
      </div>

      <button id="replay" class="replay" type="button" hidden><span data-icon="play"></span><span id="replay-label">Replay my journey</span></button>
      <div id="hud" class="hud" hidden aria-live="polite"><b id="hud-name"></b><small id="hud-when"></small></div>

      <p class="hint">Drag to spin · click the globe, then scroll to zoom</p>

      <div id="timeline" class="timeline" hidden>
        <label for="year">Years</label>
        <input id="year" type="range" step="1" />
        <output for="year"></output>
      </div>
    </section>

    <section id="story" class="story" aria-live="polite"></section>
  </main>

  <footer class="end">
    <div class="data">
      <button id="export" class="text" type="button"><span data-icon="download"></span>Export backup</button>
      <label class="text" tabindex="0"><span data-icon="upload"></span>Import<input id="import" type="file" accept="application/json" hidden /></label>
    </div>
    <p>Your trips stay in this browser. Map tiles: Esri, HERE, Garmin, © OpenStreetMap contributors. Cities and borders from Natural Earth. Flags by country-flag-icons.</p>
  </footer>

  <aside id="drawer" class="drawer" aria-label="Journal" aria-hidden="true"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
