<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="GlobeFolio" />
  <meta name="theme-color" content="#fff8ec" />
  <title>GlobeFolio</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Track every trip. Light up your world. A private 3D globe of every city and country you have been to, with passport stamps and a travel journal." />
  <meta name="color-scheme" content="light dark" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GlobeFolio" />
  <meta property="og:title" content="GlobeFolio: light up your world" />
  <meta property="og:description" content="Track every trip on a 3D globe, collect passport stamps, keep a travel journal. Private, offline, free." />
  <meta property="og:image" content="%VITE_SITE_URL%icons/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('triptrack:theme') || localStorage.getItem('wayfarer:theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <script>
    // Start the two big map downloads now, before any of the app's code has arrived; the app picks them up from here.
    try {
      var early = window.__early = { countries: fetch('geo/countries.json'), cities: fetch('geo/cities.json', { priority: 'low' }) };
      early.countries.catch(function () {}); early.cities.catch(function () {});
    } catch (e) {}
  </script>
</head>
<body>
  <noscript><p style="padding:24px;font-family:system-ui">GlobeFolio needs JavaScript to draw your globe.</p></noscript>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
  </svg>
  <div id="splash" class="splash" role="status" aria-label="GlobeFolio">
    <div class="sk-top" aria-hidden="true"><i class="sk sk-pill"></i><i class="sk sk-dot"></i></div>
    <div class="sk-bottom" aria-hidden="true"><i class="sk sk-card"></i><div class="sk-tabs"><i class="sk"></i><i class="sk"></i><i class="sk sk-add"></i><i class="sk"></i><i class="sk"></i></div></div>
    <svg class="splash-globe" viewBox="0 0 160 160" aria-hidden="true">
      <defs>
        <clipPath id="sg-clip"><circle cx="80" cy="84" r="54"/></clipPath>
        <radialGradient id="sg-shade" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#0e7490" stop-opacity=".42"/></radialGradient>
      </defs>
      <circle class="sg-orbit" cx="80" cy="84" r="70" fill="none" stroke="#FFC93C" stroke-width="4" stroke-linecap="round" stroke-dasharray="46 394"/>
      <circle cx="80" cy="84" r="54" fill="#A9DCF0"/>
      <g clip-path="url(#sg-clip)">
        <g class="sg-land" fill="#7ED6B0"><g id="sg-strip"><path d="M14 62c8-9 20-11 27-5s2 13-3 17-2 12-9 17-17 0-19-13-1-12 4-16z"/><path d="M70 50c9-7 20-5 26 2s0 15-6 19-2 17-11 21-14-6-13-17 0-17 4-25z"/><path d="M118 70c7-4 15-2 18 4s-3 11-8 12-8 8-13 5-4-14 3-21z"/><path d="M168 56c6-5 15-4 19 2s-1 11-5 14-3 11-9 11-8-9-7-16 0-8 2-11z"/><circle cx="96" cy="112" r="6"/><circle cx="150" cy="104" r="4"/></g><use href="#sg-strip" x="224"/></g>
        <g fill="none" stroke="#fff" stroke-width="1.2" opacity=".55"><path d="M26 84h108M32 62h96M32 106h96"/><ellipse class="sg-m" cx="80" cy="84" rx="24" ry="54"/><ellipse class="sg-m sg-m2" cx="80" cy="84" rx="24" ry="54"/></g>
        <circle cx="80" cy="84" r="54" fill="url(#sg-shade)"/>
      </g>
      <circle cx="80" cy="84" r="54" fill="none" stroke="#FFF8EC" stroke-width="3.4"/>
      <g class="sg-pin"><path d="M121 20c-6.4 0-11.6 4.8-11.6 10.9C109.4 40 121 52 121 52s11.6-12 11.6-21.1c0-6.1-5.2-10.9-11.6-10.9z" fill="#FF6F8E" stroke="#FFF8EC" stroke-width="3" stroke-linejoin="round"/><circle cx="121" cy="31" r="4.2" fill="#FFF8EC"/></g>
    </svg>
    <p>GlobeFolio</p>
  </div>

  <div id="app">
    <main id="view-map" class="view map" data-i18n-label="map.aria" aria-label="Your world">
      <div id="globe" role="application" data-i18n-label="map.globeAria" aria-label="Interactive globe of the places you have been"></div>

      <header class="map-top">
        <button id="stage-search" class="search-pill" type="button"><img src="/brand/logo-mark.svg" alt="" width="28" height="28" /><span data-i18n="map.search">Search any city</span><span data-icon="search"></span></button>
        <button id="settings" class="icon-btn" type="button" data-i18n-label="map.settings" aria-label="Settings"><span data-icon="cog"></span></button>
      </header>

      <div id="hud" class="hud" hidden aria-live="polite"><b id="hud-name"></b><small id="hud-when"></small></div>

      <div class="map-bottom">
        <div class="map-fabs">
          <button id="reset" class="icon-btn" type="button" data-i18n-label="map.reset" aria-label="Reset view"><span data-icon="reset"></span></button>
          <button class="icon-btn" data-do="replay" type="button" data-i18n-label="map.replay" aria-label="Replay my journey" hidden><span data-icon="play"></span></button>
        </div>
        <div id="timeline" class="timeline" hidden>
          <label for="year" data-i18n="map.years">Years</label>
          <input id="year" type="range" step="1" />
          <output for="year"></output>
        </div>
        <button id="glance" class="glance" type="button"></button>
      </div>
    </main>

    <section id="view-passport" class="view page" data-i18n-label="view.passport" aria-label="Passport" hidden><div id="passport" class="scroll"></div></section>
    <section id="view-journal" class="view page" data-i18n-label="view.journal" aria-label="Journal" hidden><div id="story" class="scroll story" aria-live="polite"></div></section>

    <nav class="tabs" data-i18n-label="tab.nav" aria-label="Main">
      <button class="tab on" data-tab="map" type="button"><span data-icon="globe"></span><small data-i18n="tab.map">Map</small></button>
      <button class="tab" data-tab="passport" type="button"><span data-icon="stamp"></span><small data-i18n="tab.passport">Passport</small></button>
      <button class="tab-add" data-do="log" type="button" data-i18n-label="tab.log" aria-label="Log a trip"><span data-icon="plus"></span></button>
      <button class="tab" data-do="surprise" type="button"><span data-icon="spark"></span><small data-i18n="tab.discover">Discover</small></button>
      <button class="tab" data-tab="journal" type="button"><span data-icon="journal"></span><small data-i18n="tab.journal">Journal</small></button>
    </nav>

    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" data-i18n-label="drawer.aria" aria-label="Trip details" aria-hidden="true"></aside>
    <div id="slam" class="slam" hidden></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
