<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#04060b" />
  <title>Wayfarer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Tenor+Sans&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="globe" aria-label="Interactive globe of the places you have been" role="application"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="top">
    <h1 class="mark">Wayfarer</h1>
    <nav class="tools" aria-label="Actions">
      <button id="log" class="log" type="button">Log a trip <kbd>/</kbd></button>
      <button id="export" class="quiet" type="button">Export</button>
      <label class="quiet" tabindex="0">Import<input id="import" type="file" accept="application/json" hidden /></label>
    </nav>
  </header>

  <footer class="foot">
    <p id="line" class="line" aria-live="polite"></p>
    <div id="timeline" class="timeline" hidden>
      <label for="year">Years</label>
      <input id="year" type="range" step="1" />
      <output for="year"></output>
    </div>
  </footer>

  <aside id="drawer" class="drawer" aria-label="Journal" aria-hidden="true"></aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
