<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Tripglobe" />
  <meta name="theme-color" content="#fff8ec" />
  <title>Tripglobe</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Track every trip. Light up your world." />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try {
      var t = localStorage.getItem('triptrack:theme') || localStorage.getItem('wayfarer:theme');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
  </svg>
  <div id="splash" class="splash" aria-hidden="true"><img src="/brand/logo-mark.svg" alt="" width="84" height="84" /><p>Tripglobe</p><span class="dots"><i></i><i></i><i></i></span></div>

  <div id="app">
    <main id="view-map" class="view map" aria-label="Your world">
      <div id="globe" role="application" aria-label="Interactive globe of the places you have been"></div>

      <header class="map-top">
        <button id="stage-search" class="search-pill" type="button"><img src="/brand/logo-mark.svg" alt="" width="28" height="28" /><span>Search any city</span><span data-icon="search"></span></button>
        <button id="theme" class="icon-btn" type="button" aria-label="Switch theme"></button>
      </header>

      <div class="map-fabs">
        <button id="reset" class="icon-btn" type="button" aria-label="Reset view"><span data-icon="reset"></span></button>
        <button class="icon-btn" data-do="replay" type="button" aria-label="Replay my journey" hidden><span data-icon="play"></span></button>
      </div>

      <div id="hud" class="hud" hidden aria-live="polite"><b id="hud-name"></b><small id="hud-when"></small></div>

      <div id="timeline" class="timeline" hidden>
        <label for="year">Years</label>
        <input id="year" type="range" step="1" />
        <output for="year"></output>
      </div>

      <button id="glance" class="glance" type="button" aria-label="Open your passport"></button>
    </main>

    <section id="view-passport" class="view page" aria-label="Passport" hidden><div id="passport" class="scroll"></div></section>
    <section id="view-journal" class="view page" aria-label="Journal" hidden><div id="story" class="scroll story" aria-live="polite"></div></section>

    <nav class="tabs" aria-label="Main">
      <button class="tab on" data-tab="map" type="button"><span data-icon="globe"></span><small>Map</small></button>
      <button class="tab" data-tab="passport" type="button"><span data-icon="stamp"></span><small>Passport</small></button>
      <button class="tab-add" data-do="log" type="button" aria-label="Log a trip"><span data-icon="plus"></span></button>
      <button class="tab" data-do="surprise" type="button"><span data-icon="spark"></span><small>Discover</small></button>
      <button class="tab" data-tab="journal" type="button"><span data-icon="journal"></span><small>Journal</small></button>
    </nav>

    <aside id="drawer" class="drawer" aria-label="Trip details" aria-hidden="true"></aside>
    <div id="slam" class="slam" hidden></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
